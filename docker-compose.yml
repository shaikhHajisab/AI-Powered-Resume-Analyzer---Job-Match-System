
version: '3.8'

services:

  # PostgreSQL database service
  db:
    image: postgres:16-alpine        # official postgres image, alpine = tiny
    restart: always
    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
    volumes:
      # persist data — without this, DB resets every container restart
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"                  # host:container port mapping
    healthcheck:
      # wait for postgres to be ready before starting app
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI application service
  app:
    build: .                         # build from Dockerfile in current directory
    restart: always
    ports:
      - "8000:8000"
    environment:
      # override .env values for Docker environment
      DATABASE_URL: postgresql://resume_user:resume_password@db:5432/resume_db
      # db = hostname of the postgres service above (Docker internal DNS)
      SECRET_KEY: ${SECRET_KEY}      # reads from your .env file
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy   # wait for db healthcheck to pass
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
      # runs migrations then starts server
      # every deployment automatically applies new migrations

volumes:
  postgres_data:                     # named volume — persists between restarts